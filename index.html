<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TV Recon</title>
    <style>
        body { background: #0a0f14; color: #7fdbca; font-family: monospace; padding: 60px; }
        h1 { color: #ffcb6b; }
        .box { border: 2px solid #263341; border-radius: 12px; padding: 24px; margin-top: 30px; background: #101820; }
        .ok { color: #c3e88d; }
        .warn { color: #ffcb6b; }
        .small { font-size: 24px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>&#128737;&#65039; TV Recon</h1>
    <div class="box small">
        <p class="ok">&#10004; Recon service is running.</p>
        <p>Probing runtime, filesystem, Tizen APIs and sdbd.</p>
        <p class="warn">Results are being sent to the analyst workstation (192.168.86.86:5555).</p>
        <p class="small">If nothing is listening there, results are lost silently.</p>
    </div>
</body>
</html>
